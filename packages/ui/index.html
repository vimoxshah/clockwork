<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- S-audit hardening: everything is same-origin (daemon serves UI + API + SSE).
         style-src keeps unsafe-inline for React style props; ws: entries are the
         Vite dev-server HMR ports only. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost ws://127.0.0.1:5173 ws://localhost:5173; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Clockwork</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
