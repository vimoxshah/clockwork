name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gauntlet:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # No `version:` input here — pnpm/action-setup reads packageManager
      # from package.json; specifying both causes ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + scenario tests
        run: pnpm test

      - name: UI calendar-grid tests
        run: pnpm --filter @clockwork/ui test

      - name: Build all packages
        run: pnpm build

      - name: Daemon boot smoke
        run: |
          node packages/daemon/dist/main.js &
          DAEMON_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4747/health | grep -q '"ok":true'; then
              echo "daemon healthy"
              kill $DAEMON_PID 2>/dev/null
              exit 0
            fi
            sleep 0.5
          done
          echo "daemon failed to become healthy"
          exit 1

  # T1-13: a real Chromium click-through against the real served app, not just
  # a /health curl. CW_ENGINE=mock (runner-child.ts) + CW_MOCK_STEP_MS make the
  # scheduler -> run-manager -> mock engine -> finalize pipeline deterministic
  # and require no real provider CLI, API spend, or network call. Runs the
  # promoted subset only (packages/ui/e2e/smoke/) — the rest of e2e/ is
  # debugging tools, not tests.
  #
  # T4-10 promoted spikes/a11y-audit.cjs + spikes/kbd-a11y-check.cjs here too,
  # rewritten to actually assert (the originals printed diagnostics and always
  # exited 0). timeout-minutes went 5 -> 8: two more real-browser scripts,
  # each sweeping every tab, don't fit the old 5-minute ceiling.
  smoke:
    runs-on: macos-14
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Chromium only (not the full playwright install) — no --with-deps,
      # that flag shells out to apt-get and macOS doesn't have one. No npx —
      # the `playwright` CLI is already a root devDependency; npx would try a
      # registry fetch, which the job isn't allowed to need.
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install chromium

      - name: Playwright smoke (book/run/report + command palette + a11y/keyboard audits)
        env:
          CW_ENGINE: mock
          CW_MOCK_STEP_MS: "250"
        run: |
          node packages/daemon/dist/main.js > daemon.log 2>&1 &
          echo $! > daemon.pid
          trap 'kill "$(cat daemon.pid)" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4747/health | grep -q '"ok":true'; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != "1" ]; then
            echo "daemon failed to become healthy"
            exit 1
          fi

          # tsx isn't hoisted to the workspace root (it's @clockwork/daemon's
          # devDependency) — invoke it from there rather than add a root
          # dependency or reach for a network-fetching `npx tsx`.
          ./packages/daemon/node_modules/.bin/tsx packages/ui/e2e/smoke/book-run-report.ts
          ./packages/daemon/node_modules/.bin/tsx packages/ui/e2e/smoke/command-palette.ts
          # T4-10: run after book-run-report.ts so Tasks/Inbox hold a real row
          # (the Tasks overflow-menu + "Finished" bucket checks need one),
          # not an empty state.
          #
          # The ordering below is kept but is no longer load-bearing. It was
          # chosen when a11y-audit.ts was red on two contrast findings
          # (TasksView.tsx / ComposerView.tsx): this step has no `&&`/`||`
          # between commands, so it runs under the runner's default `bash -e`
          # and stops at the first non-zero exit — a red a11y-audit.ts running
          # first meant kbd-a11y-check.ts never appeared in the log at all.
          # Both findings were fixed by the light-mode accent correction
          # (6192615), and all four scripts now pass, so nothing here is
          # sequenced around an expected failure any more.
          ./packages/daemon/node_modules/.bin/tsx packages/ui/e2e/smoke/kbd-a11y-check.ts
          ./packages/daemon/node_modules/.bin/tsx packages/ui/e2e/smoke/a11y-audit.ts

      - name: Daemon log
        if: failure()
        run: cat daemon.log || true
