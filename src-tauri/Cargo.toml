[package]
name = "clockwork"
version = "0.8.0"
description = "The calendar where your agents show up for work."
edition = "2021"

[lib]
name = "clockwork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clockwork"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
