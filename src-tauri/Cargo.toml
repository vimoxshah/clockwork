[package]
name = "clockwork"
version = "0.12.0"
description = "The calendar where your agents show up for work."
edition = "2021"

[lib]
name = "clockwork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clockwork"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` and nothing else (T4-3). It gates `tauri::tray` alone
# (tauri-2.11.5/src/lib.rs:112); `tauri::menu` is already unconditional on
# desktop, and the tray's icon comes from `default_window_icon()`, which
# tauri-codegen bakes as raw RGBA from `icons/32x32.png` — so no `image-png`.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# T1-6 — "check for updates" needs one real TLS request, to api.github.com.
# `http_get`/`http_get_status` above are a hand-rolled client on purpose: they
# only ever speak plaintext HTTP to 127.0.0.1, and rolling TLS by hand is not
# something to attempt for a feature this small. `ureq`'s DEFAULT features are
# already `rustls` + `gzip` (github.com/algesten/ureq README, "Features") —
# pure-Rust TLS via rustls/webpki-roots, no OpenSSL to link against on macOS —
# so no extra feature flags are enabled here. `json` (serde-body helpers) is
# left off: `serde_json` is already a dependency and every other body in this
# file is parsed the same way (`serde_json::from_str` on a `String`), so a
# second JSON path would just be two ways to do one thing.
ureq = "3"
